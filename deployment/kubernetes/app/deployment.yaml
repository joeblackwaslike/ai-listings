apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-listings
  namespace: ai-listings
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-listings
  template:
    metadata:
      labels:
        app: ai-listings
    spec:
      # Soft preference to land replicas on different nodes -- gives real
      # node-failure redundancy on this 3-node cluster when there's room, but
      # won't block scheduling (e.g. during a node drain) if there isn't.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: ai-listings
                topologyKey: kubernetes.io/hostname
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: ai-listings
          image: ghcr.io/joeblackwaslike/ai-listings:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: ai-listings-config
            - secretRef:
                name: ai-listings-secret
          resources:
            # Bumped for the Agent SDK's per-call `claude` CLI subprocess (only spawned when
            # CLAUDE_CODE_OAUTH_TOKEN is set — the api-key backend path is unchanged). This is
            # a conservative estimate, not a measured one — watch `kubectl top pod` under real
            # pipeline load after enabling the OAuth backend and adjust if it's OOM-killing.
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "1Gi"
              cpu: "750m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
