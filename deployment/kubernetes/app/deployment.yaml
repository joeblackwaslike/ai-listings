apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-listings
  namespace: ai-listings
spec:
  replicas: 2
  # maxUnavailable: 0 / maxSurge: 1 is already k8s's default rounding for 2
  # replicas -- made explicit here so it stays true if replicas ever changes.
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ai-listings
  template:
    metadata:
      labels:
        app: ai-listings
    spec:
      # 2026-08-23 incident: Inngest's SDK callbacks (including the pipeline's Claude
      # Vision calls, which can run well past the default 30s grace period) started
      # erroring "Unable to reach SDK URL" / "EOF writing request to SDK" during
      # rollouts. Next.js App Router's `next start` already drains in-flight requests
      # gracefully on SIGTERM by default (no custom signal handler needed --
      # node_modules/next/dist/docs/01-app/02-guides/self-hosting.md, "When stopping
      # the server... The Next.js server will finish in-flight requests... Platforms
      # should allow a configurable drain period (10-30 seconds is recommended)").
      # What was missing was the budget: the 5s preStop sleep (below, for kube-proxy
      # endpoint propagation) was eating into the default 30s terminationGracePeriodSeconds,
      # so a slow in-flight request could still get SIGKILLed before Next finished it.
      terminationGracePeriodSeconds: 60
      # Soft preference to land replicas on different nodes -- gives real
      # node-failure redundancy on this 3-node cluster when there's room, but
      # won't block scheduling (e.g. during a node drain) if there isn't.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: ai-listings
                topologyKey: kubernetes.io/hostname
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: ai-listings
          image: ghcr.io/joeblackwaslike/ai-listings:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          lifecycle:
            preStop:
              exec:
                # Gives kube-proxy time to remove this pod from the Service's endpoints
                # before the container actually stops accepting connections -- without
                # this, SIGTERM and endpoint removal race, and in-flight requests
                # (including Inngest's SDK callbacks) can hit a pod that's already gone.
                command: ["sh", "-c", "sleep 5"]
          envFrom:
            - configMapRef:
                name: ai-listings-config
            - secretRef:
                name: ai-listings-secret
          resources:
            # Bumped for the Agent SDK's per-call `claude` CLI subprocess (only spawned when
            # CLAUDE_CODE_OAUTH_TOKEN is set — the api-key backend path is unchanged). This is
            # a conservative estimate, not a measured one — watch `kubectl top pod` under real
            # pipeline load after enabling the OAuth backend and adjust if it's OOM-killing.
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "1Gi"
              cpu: "750m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
