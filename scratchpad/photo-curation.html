    }
  }
  :root[data-theme="dark"] {
    --bg: #0c0b10;
    --surface: #15131b;
    --sidebar-bg: #100e16;
    --border: #26233a;
    --text: #f0ede6;
    --text-muted: #7b7587;
    --accent: #bfa06a;
    --accent-dim: rgba(191,160,106,.12);
    --ok: #4fa87a;
    --ok-dim: rgba(79,168,122,.12);
    --warn: #d4594a;
    --warn-dim: rgba(212,89,74,.12);
    --photo-overlay: rgba(0,0,0,.55);
  }
  :root[data-theme="light"] {
    --bg: #f5f3ee;
    --surface: #ffffff;
    --sidebar-bg: #eeece7;
    --border: #dbd7cf;
    --text: #1a1816;
    --text-muted: #7a766e;
    --accent: #a07840;
    --accent-dim: rgba(160,120,64,.11);
    --ok: #3a8a5a;
    --ok-dim: rgba(58,138,90,.11);
    --warn: #c44444;
    --warn-dim: rgba(196,68,68,.11);
    --photo-overlay: rgba(0,0,0,.42);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .header-left h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 600;
    font-size: 20px;
    margin: 0;
    letter-spacing: .01em;
  }
  .header-left .sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .theme-toggle {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
    letter-spacing: .03em;
    transition: border-color .15s, color .15s;
  }
  .theme-toggle:hover { border-color: var(--text-muted); color: var(--text); }
  .app-body {
    flex: 1;
    display: flex;
    min-height: 0;
    overflow: hidden;
  }
  .sidebar {
    width: 210px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    padding: 14px 10px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .sidebar-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--text-muted);
    padding: 0 6px;
    margin-bottom: 4px;
  }
  .listing-tab {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
    background: var(--surface);
  }
  .listing-tab:hover { border-color: var(--accent); }
  .listing-tab.active { border-color: var(--accent); background: var(--accent-dim); }
  .tab-sku {
    font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .04em;
  }
  .tab-short {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tab-badge {
    display: inline-flex;
    align-items: center;
    margin-top: 7px;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    padding: 2px 8px;
    border-radius: 99px;
  }
  .tab-badge.ok { background: var(--ok-dim); color: var(--ok); }
  .tab-badge.warn { background: var(--warn-dim); color: var(--warn); }
  .main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .listing-header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }
  .listing-title {
    flex: 1;
    min-width: 0;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: .01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sel-count {
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    padding: 4px 12px;
    border-radius: 99px;
    transition: background .2s, color .2s;
  }
  .sel-count.ok { background: var(--ok-dim); color: var(--ok); }
  .sel-count.warn { background: var(--warn-dim); color: var(--warn); }
  .hint-msg {
    font-size: 11px;
    color: var(--text-muted);
    flex-shrink: 0;
  }
  .grid-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 18px 22px;
  }
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 9px;
  }
  @media (max-width: 640px) { .photo-grid { grid-template-columns: repeat(2, 1fr); } }
  .photo-card {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 7px;
    overflow: hidden;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color .15s, transform .12s;
    background: var(--border);
  }
  .photo-card:hover { transform: scale(1.025); z-index: 1; }
  .photo-card.selected { border-color: var(--accent); }
  .photo-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo-overlay {
    position: absolute;
    inset: 0;
    background: var(--photo-overlay);
    opacity: 0;
    transition: opacity .15s;
  }
  .photo-card:not(.selected) .photo-overlay { opacity: 1; }
  .indicator {
    position: absolute;
    bottom: 7px;
    right: 7px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    pointer-events: none;
  }
  .photo-card.selected .indicator { background: var(--accent); color: #fff; }
  .photo-card:not(.selected) .indicator { background: rgba(255,255,255,.18); color: rgba(255,255,255,.65); }
  .order-badge {
    position: absolute;
    top: 6px;
    left: 6px;
    background: rgba(0,0,0,.55);
    color: rgba(255,255,255,.8);
    font-size: 9px;
    padding: 2px 5px;
    border-radius: 3px;
    font-family: ui-monospace, 'SF Mono', monospace;
    pointer-events: none;
  }
  .auth-badge {
    position: absolute;
    top: 6px;
    right: 6px;
    background: var(--accent);
    color: #fff;
    font-size: 8.5px;
    font-weight: 600;
    letter-spacing: .05em;
    text-transform: uppercase;
    padding: 2px 5px;
    border-radius: 3px;
    pointer-events: none;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0) scale(1.025); }
    20% { transform: translateX(-5px) scale(1.025); }
    60% { transform: translateX(5px) scale(1.025); }
  }
  .shake { animation: shake .28s ease; }
  .command-bar {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 12px 22px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .cmd-wrap {
    flex: 1;
    min-width: 0;
    font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace;
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cmd-wrap .hl { color: var(--text); }
  .copy-btn {
    flex-shrink: 0;
    padding: 7px 16px;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity .15s;
  }
  .copy-btn:hover { opacity: .85; }
  .copy-btn:disabled { opacity: .35; cursor: not-allowed; }
  .copied-msg {
    font-size: 11px;
    color: var(--ok);
    flex-shrink: 0;
    opacity: 0;
    transition: opacity .25s;
    pointer-events: none;
  }
  .copied-msg.show { opacity: 1; }
</style>

let activeSku = LISTINGS[0].sku;
const selections = new Map();

for (const l of LISTINGS) {
  selections.set(l.sku, new Set(l.photos.slice(0, 16).map(p => p.id)));
}

const themeBtn = document.getElementById('themeBtn');
themeBtn.addEventListener('click', () => {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark'
    || (!document.documentElement.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
  if (isDark) {
    document.documentElement.setAttribute('data-theme', 'light');
    themeBtn.textContent = 'Dark';
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    themeBtn.textContent = 'Light';
  }
});
if (window.matchMedia('(prefers-color-scheme: dark)').matches) themeBtn.textContent = 'Light';

function getSelected(sku) { return selections.get(sku); }
function getCount(sku) { return getSelected(sku).size; }

function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '<div class="sidebar-label">Listings</div>' + LISTINGS.map(l => {
    const cnt = getCount(l.sku);
    const tot = l.photos.length;
    const ok = cnt <= 16;
    return `<div class="listing-tab ${l.sku === activeSku ? 'active' : ''}" data-sku="${l.sku}">
      <div class="tab-sku">${l.sku}</div>
      <div class="tab-short">${l.shortTitle}</div>
      <div class="tab-badge ${ok ? 'ok' : 'warn'}">${cnt} / ${tot}${ok ? ' ✓' : ' — remove ' + (cnt - 16)}</div>
    </div>`;
  }).join('');
  sidebar.querySelectorAll('.listing-tab').forEach(el => {
    el.addEventListener('click', () => { activeSku = el.dataset.sku; render(); });
  });
}

function renderHeader() {
  const l = LISTINGS.find(l => l.sku === activeSku);
  const cnt = getCount(activeSku);
  const tot = l.photos.length;
  const ok = cnt <= 16;
  document.getElementById('listingHeader').innerHTML = `
    <div class="listing-title">${l.title}</div>
    <span class="sel-count ${ok ? 'ok' : 'warn'}">${cnt} of ${tot} selected${ok ? '' : ` — deselect ${cnt - 16}`}</span>
    ${ok ? '<span class="hint-msg">Ready to publish</span>' : ''}
  `;
}

function renderGrid() {
  const l = LISTINGS.find(l => l.sku === activeSku);
  const sel = getSelected(activeSku);
  const grid = document.getElementById('photoGrid');
  grid.innerHTML = l.photos.map(p => {
    const selected = sel.has(p.id);
    return `<div class="photo-card ${selected ? 'selected' : ''}" data-id="${p.id}" data-sku="${activeSku}">
      <img src="${p.url}" loading="lazy" alt="Photo ${p.order}" draggable="false">
      <div class="photo-overlay"></div>
      <div class="order-badge">#${p.order}</div>
      ${p.type === 'auth_card' ? '<div class="auth-badge">Auth</div>' : ''}
      <div class="indicator">${selected ? '✓' : '✕'}</div>
    </div>`;
  }).join('');
  grid.querySelectorAll('.photo-card').forEach(el => {
    el.addEventListener('click', () => togglePhoto(el.dataset.sku, el.dataset.id, el));
  });
}

function renderCommandBar() {
  const l = LISTINGS.find(l => l.sku === activeSku);
  const sel = getSelected(activeSku);
  const ok = sel.size <= 16;
  const sortedIds = l.photos.filter(p => sel.has(p.id)).map(p => p.id);
  const ids = sortedIds.join(',');
  const cmd = `npx tsx scripts/publish-one-to-poshmark.ts --sku ${activeSku} --photos "${ids}" --commit`;
  document.getElementById('commandBar').innerHTML = `
    <div class="cmd-wrap"><span class="hl">npx tsx scripts/publish-one-to-poshmark.ts</span> --sku <span class="hl">${activeSku}</span> --photos "<span class="hl">${ids.slice(0, 40)}${ids.length > 40 ? '…' : ''}</span>" --commit</div>
    <span class="copied-msg" id="copiedMsg">Copied!</span>
    <button class="copy-btn" id="copyBtn" ${ok ? '' : 'disabled'}>Copy command</button>
  `;
  document.getElementById('copyBtn').addEventListener('click', () => {
    navigator.clipboard.writeText(cmd).then(() => {
      const msg = document.getElementById('copiedMsg');
      msg.classList.add('show');
      setTimeout(() => msg.classList.remove('show'), 1800);
    });
  });
}

function togglePhoto(sku, photoId, el) {
  const sel = getSelected(sku);
  if (sel.has(photoId)) {
    sel.delete(photoId);
  } else {
    if (sel.size >= 16) {
      el.classList.add('shake');
      el.addEventListener('animationend', () => el.classList.remove('shake'), { once: true });
      const hdr = document.querySelector('.sel-count');
      if (hdr) { hdr.classList.add('shake'); hdr.addEventListener('animationend', () => hdr.classList.remove('shake'), { once: true }); }
      return;
    }
    sel.add(photoId);
  }
  render();
}

function render() {
  renderSidebar();
  renderHeader();
  renderGrid();
  renderCommandBar();
}

render();
</script>
