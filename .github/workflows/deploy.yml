name: Build & Deploy

on:
  push:
    branches: [main]
    # Rebuilding and restarting the app pods is disruptive to in-flight Inngest pipeline
    # runs (a redeploy mid-step forces a retry, and enough of them back-to-back pushes retry
    # backoff out to tens of minutes -- confirmed 2026-08-23: repeated deploys for unrelated
    # dashboard/settings changes stalled a listing backlog for over an hour). Scope the
    # trigger to files that actually affect the built image (deployment/ is already excluded
    # from the Docker build context via .dockerignore) so infra-manifest, docs, and script
    # commits stop forcing a restart nothing needed.
    paths:
      - 'src/**'
      - 'public/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'postcss.config.mjs'
      - 'deployment/Dockerfile'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/joeblackwaslike/ai-listings

jobs:
  build:
    name: Build ARM64 image
    # Native ARM64 GitHub-hosted runner (free, GA for public repos) — building
    # linux/arm64 here runs natively instead of under QEMU cross-compilation,
    # which was the dominant cost on ubuntu-latest (x86) for any commit that
    # touches source, since that always invalidates the `npm run build` layer.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to k3s
    needs: build
    # Runs on the self-hosted runner inside the cluster — direct kubectl access, no Tailscale needed
    runs-on: [self-hosted, linux, arm64, k3s]
    environment: production

    steps:
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/arm64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/kubectl

      - name: Restart deployment
        run: kubectl rollout restart deployment/ai-listings -n ai-listings

      - name: Wait for rollout
        run: kubectl rollout status deployment/ai-listings -n ai-listings --timeout=300s

      # `--sdk-url` on the Inngest server only registers the app once, at Inngest's own
      # startup -- it does NOT re-sync on every app deploy, so a function added/changed here
      # silently never reaches Inngest until something re-triggers the sync. This used to be a
      # postStart hook on the Inngest deployment itself, but that hook (and any other exec into
      # that container) hard-fails with "exec format error" -- its image has no working shell
      # for this architecture. PUTing the app's own /api/inngest endpoint triggers the same
      # sync from a container that does have a working shell (this one). Confirmed missing
      # 2026-08-24: auto-recover-pipeline.ts shipped and rolled out clean but never appeared in
      # Inngest's function list until this exact call was run by hand.
      - name: Sync Inngest functions
        run: |
          POD=$(kubectl get pods -n ai-listings -l app=ai-listings -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n ai-listings "${POD}" -- node -e "
            fetch('http://localhost:3000/api/inngest', { method: 'PUT' })
              .then(r => r.text().then(t => { console.log('status:', r.status, t); if (!r.ok) process.exit(1) }))
              .catch(e => { console.error('error:', e); process.exit(1) })
          "

      - name: Show running pods
        run: kubectl get pods -n ai-listings
