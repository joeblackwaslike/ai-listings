name: Image smoke test

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.bun-version'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'postcss.config.mjs'
      - 'deployment/Dockerfile'
      - 'deployment/scripts/smoke-image.sh'
      - '.github/workflows/image-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    name: Build and smoke-test ARM64 image
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Tool versions
        id: versions
        run: |
          echo "bun=$(cat .bun-version)" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(jq -r '.packageManager | sub("^pnpm@"; "")' package.json)" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/Dockerfile
          platforms: linux/arm64
          load: true
          tags: ai-listings:smoke
          build-args: |
            BUN_VERSION=${{ steps.versions.outputs.bun }}
            PNPM_VERSION=${{ steps.versions.outputs.pnpm }}
            NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321
            NEXT_PUBLIC_SUPABASE_ANON_KEY=smoke-anon-key
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: deployment/scripts/smoke-image.sh ai-listings:smoke
